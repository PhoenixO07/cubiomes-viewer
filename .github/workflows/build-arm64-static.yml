name: Build Static ARM64 Executable

on:
  push:
    branches: [ trunk ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake make

      - name: Configure CMake (ARM64 static)
        run: |
          mkdir -p build-arm64
          cd build-arm64
          cmake ../cubiomes \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_C_FLAGS="-static" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cd build-arm64
          make -j$(nproc)

      - name: Strip binary
        run: |
          aarch64-linux-gnu-strip build-arm64/cubiomes-viewer

      - name: Upload ARM64 static binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-static-arm64
          path: build-arm64/cubiomes-viewer
