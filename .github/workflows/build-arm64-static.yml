name: Build Cubiomes Viewer for ARM64 (Static)

on:
  push: # Triggers the workflow on push events to any branch
    paths: # Only run if relevant files are changed (optional, but good practice)
      - '**.cpp'
      - '**.h'
      - '**.pro'
      - '.github/workflows/build-arm64.yml'
  workflow_dispatch: # Allows you to manually trigger the workflow from the Actions tab

jobs:
  build-arm64-static:
    name: Build Static ARM64 Executable
    runs-on: ubuntu-latest-arm64 # Use GitHub-hosted ARM64 runner

    env:
      QT_VERSION_FULL: "5.15.12" # Define Qt version
      QT_STATIC_INSTALL_PATH: "${{ github.workspace }}/qt5-static-arm64" # Installation path for static Qt

    steps:
      - name: Checkout Cubiomes Viewer Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Important for the cubiomes library

      - name: Install Build Dependencies for Qt and App
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config git \
            libfontconfig1-dev libfreetype6-dev libx11-dev libxext-dev \
            libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libx11-xcb-dev \
            libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev \
            libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev \
            libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev \
            libxcb-cursor-dev libjpeg-dev libpng-dev libz-dev libinput-dev \
            libgl1-mesa-dev # Or libgles2-mesa-dev for OpenGL ES
            # Ensure all dependencies required by Qt configure are listed

      - name: Cache static Qt build
        id: cache-qt-static
        uses: actions/cache@v4
        with:
          path: ${{ env.QT_STATIC_INSTALL_PATH }}
          key: ${{ runner.os }}-qt-static-${{ env.QT_VERSION_FULL }}-arm64-v1-${{ hashFiles('**/qtbase-everywhere-opensource-src-${{ env.QT_VERSION_FULL }}/.git') }} # Cache key based on Qt version and OS

      - name: Build and Install Static Qt (if not cached)
        if: steps.cache-qt-static.outputs.cache-hit != 'true'
        run: |
          echo "Cache miss or invalid, building Qt ${QT_VERSION_FULL} statically..."
          QT_MAJOR_MINOR=$(echo "${QT_VERSION_FULL}" | cut -d. -f1,2)
          
          mkdir -p ${{ github.workspace }}/qt_source
          cd ${{ github.workspace }}/qt_source
          
          wget -q "https://download.qt.io/archive/qt/${QT_MAJOR_MINOR}/${QT_VERSION_FULL}/submodules/qtbase-everywhere-opensource-src-${QT_VERSION_FULL}.tar.xz"
          tar xf "qtbase-everywhere-opensource-src-${QT_VERSION_FULL}.tar.xz"
          
          cd "qtbase-everywhere-src-${QT_VERSION_FULL}"
          
          # Configure Qt (adjust -opengl flag if needed, e.g. -opengl es2 for RPi like targets)
          ./configure -release -static -opensource -confirm-license \
            -nomake examples -nomake tests \
            -fontconfig -system-freetype \
            -qt-zlib -qt-libjpeg -qt-libpng -qt-pcre -qt-harfbuzz \
            -opengl desktop `# Using desktop OpenGL, ensure mesa devs are installed. Use -opengl es2 if targeting embedded/RPi` \
            -no-pch \
            -prefix ${{ env.QT_STATIC_INSTALL_PATH }} \
            -skip qtwayland -skip qtwebengine \
            -platform linux-g++-64 # Should pick up arm64 environment correctly
            
          echo "Running make for Qt..."
          make -j$(nproc)
          echo "Running make install for Qt..."
          make install
          echo "Static Qt build and installation complete."
        # This step can take a VERY long time (potentially hours)

      - name: Verify Qt Installation (if built or cached)
        run: |
          ls -l ${{ env.QT_STATIC_INSTALL_PATH }}/bin/qmake || echo "qmake not found, Qt build/cache might have failed."
          ${{ env.QT_STATIC_INSTALL_PATH }}/bin/qmake -v

      - name: Build Cubiomes Viewer
        run: |
          cd ${{ github.workspace }} # Should be the root of your checkout (cubiomes-viewer)
          mkdir build
          cd build
          # Point to the statically built qmake
          ${{ env.QT_STATIC_INSTALL_PATH }}/bin/qmake ../cubiomes-viewer.pro
          make -j$(nproc)

      - name: Upload Cubiomes Viewer Executable
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-arm64-static
          path: ${{ github.workspace }}/build/cubiomes-viewer # Path to the executable
          if-no-files-found: error # Fail the workflow if the artifact is not found
