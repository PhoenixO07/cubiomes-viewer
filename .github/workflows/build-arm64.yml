# .github/workflows/build-arm64.yml
name: Build Cubiomes Viewer (AArch64)

on:
  push:
    branches: [ main, trunk ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch your code + submodules
      - name: Checkout repo (w/ submodules)
        uses: actions/checkout@v3
        with:
          submodules: recursive

      # 2. Register QEMU emulation for ARM
      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v2
        with:
          platforms: linux/arm64

      # 3. Do the build inside the ARM container
      - name: Build in ARM64 container
        uses: addnab/docker-run-action@v3
        with:
          image: arm64v8/ubuntu:20.04
          options: --privileged --workdir /github/workspace
          run: |
            set -e
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential \
              cmake \
              git \
              pkg-config \
              qtbase5-dev \
              qttools5-dev-tools \
              libqt5svg5-dev \
              libssl-dev

            mkdir -p build
            cd build

            cmake .. \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local
              # -DCMAKE_EXE_LINKER_FLAGS="-static"   # <-- if you're supplying your own static Qt libs

            make -j$(nproc)
            strip cubiomes-viewer

      # 4. Upload the finished binary
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-aarch64
          path: build/cubiomes-viewer
