name: Build Cubiomes Viewer for ARM64 (Shared)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-compilation and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Configure build (CMake for ARM64)
      - name: Configure build (CMake for ARM64)
        run: |
          mkdir -p build-arm64
          cd build-arm64
          cmake ../cubiomes \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja
            
      - name: Build project
        run: |
          cd build-arm64
          ninja

      - name: Strip binary (optional)
        run: |
          file build-arm64/cubiomes-viewer
          aarch64-linux-gnu-strip build-arm64/cubiomes-viewer || true

      - name: Upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-arm64
          path: build-arm64/cubiomes-viewer
