# .github/workflows/build-arm64.yml
name: Build Cubiomes Viewer for ARM64 (Shared)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ARM64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive  # cubiomes is a submodule

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            cmake \
            ninja-build \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev

      - name: Configure CMake for ARM64
        run: |
          mkdir -p build-arm64
          cd build-arm64
          cmake ../cubiomes-viewer \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: |
          cd build-arm64
          ninja

      - name: Strip Binary (Optional)
        run: |
          file build-arm64/cubiomes-viewer
          aarch64-linux-gnu-strip build-arm64/cubiomes-viewer || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-arm64
          path: build-arm64/cubiomes-viewer
