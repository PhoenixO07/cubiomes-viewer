name: Build ARM64

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    name: Build for ARM64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Needed to fetch the cubiomes submodule

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            ninja-build \
            cmake \
            build-essential

      - name: Create build directory and configure project
        run: |
          mkdir -p build-arm64
          cd build-arm64
          cmake ../cubiomes \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -G Ninja

      - name: Build
        run: |
          cd build-arm64
          ninja

      - name: Strip binaries
        run: |
          cd build-arm64
          find . -type f -executable -exec file {} \; | grep 'ELF' | cut -d: -f1 | xargs --no-run-if-empty aarch64-linux-gnu-strip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-arm64
          path: build-arm64/*
