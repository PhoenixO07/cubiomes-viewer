# .github/workflows/build-arm64.yml
name: Build Cubiomes Viewer (AArch64)

on:
  push:
    branches: [ main, trunk ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-latest
    container:
      image: arm64v8/ubuntu:20.04
      options: --init

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            git \
            pkg-config \
            qtbase5-dev \
            qttools5-dev-tools \
            libqt5svg5-dev

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
            # for static Qt builds, supply static libs and uncomment:
            # -DCMAKE_EXE_LINKER_FLAGS="-static"

      - name: Compile
        run: |
          cd build
          make -j$(nproc)

      - name: Strip symbols
        if: success()
        run: |
          strip build/cubiomes-viewer

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-aarch64
          path: build/cubiomes-viewer
