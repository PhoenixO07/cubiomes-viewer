# .github/workflows/build-arm64-docker.yml
name: Build ARM64 Cubiomes Viewer (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build in ARM64 Container
    runs-on: ubuntu-latest

    steps:
      # 1) Set up QEMU so that Docker can emulate ARM64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2) Set up Buildx (multi-platform builder)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3) Checkout your code + submodules
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 4) Build inside an Ubuntu:20.04 ARM64 container
      - name: Build in ARM64 container
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/src \
            -w /src \
            ubuntu:20.04 \
            bash -euxc "
              apt-get update && apt-get install -y \
                qt5-default qttools5-dev-tools \
                build-essential git \
                libglu1-mesa-dev libx11-dev libxrandr-dev \
                libxi-dev libxrender-dev libfontconfig1-dev

              git submodule update --init --recursive

              mkdir -p build && cd build
              qmake ../cubiomes-viewer.pro \
                CONFIG+=release \
                QMAKE_CXXFLAGS+='-O2'
              make -j\$(nproc)

              # verify it's ARM64:
              file cubiomes-viewer
            "

      # 5) Grab the binary out and upload as artifact
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-arm64
          path: build/cubiomes-viewer
