# .github/workflows/build-arm64-docker.yml
name: Build ARM64 Cubiomes Viewer (Docker)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build in ARM64 container

    steps:
      # 1) Allow QEMU to emulate ARM64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2) Enable multi-arch builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 3) Grab your code + submodules
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 4) Build inside an ARM64 Ubuntu container
      - name: Build with distro Qt in ARM64
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$PWD":/src \
            -w /src \
            ubuntu:20.04 \
            bash -euxc "
              # avoid any tzselect prompts (just in case)
              export TZ=Asia/Kolkata

              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y \
                qt5-default qttools5-dev-tools \
                build-essential git \
                libglu1-mesa-dev libx11-dev libxrandr-dev \
                libxi-dev libxrender-dev libfontconfig1-dev

              git submodule update --init --recursive

              # build directory
              mkdir -p build && cd build

              # this will pick up cubiomes/ automatically
              qmake ../cubiomes-viewer.pro \
                CONFIG+=release \
                QMAKE_CXXFLAGS+='-O2'

              make -j\$(nproc)

              # sanity-check
              file cubiomes-viewer
            "

      # 5) Upload the resulting ARM64 ELF
      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: cubiomes-viewer-arm64
          path: build/cubiomes-viewer
